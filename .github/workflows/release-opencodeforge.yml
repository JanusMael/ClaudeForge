name: Release OpenCodeForge

# Triggered by a PREFIXED version tag: opencodeforge-v1.2.3 (or -rc.1 for a pre-release).
#
# ⚠ The prefix is not decoration. GitHub releases are repository-level, and this repository
# hosts two apps, so an app's update check finds its own releases by tag prefix — see
# AgentForge.Core/Updates/ReleaseTagScheme.cs. ClaudeForge publishes BARE tags (v2026.3.810)
# because releases already exist in that shape and every installed copy looks for exactly it;
# OpenCodeForge, shipping second, takes the prefix.
#
# ⛔ THIS IS A SEPARATE WORKFLOW ON PURPOSE, not a matrix dimension added to release.yml.
# The two apps cannot share one: a workflow is selected by its tag trigger, and the two tag
# shapes are disjoint. Widening release.yml's 'v*.*.*' to also catch this app's tags would
# attach ClaudeForge binaries to what users see as an OpenCodeForge release. release.yml's own
# header says the same thing from the other side.
on:
  push:
    tags:
      - 'opencodeforge-v*.*.*'

# Required to create the GitHub Release, upload assets, and read PR bodies.
permissions:
  contents: write
  pull-requests: read   # needed to read PR body for release notes

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  APP_NAME: OpenCodeForge
  # The tag prefix this workflow strips to recover the bare version. Must stay equal to
  # ReleaseTagScheme's PublishPrefix for this app plus the conventional 'v'.
  TAG_PREFIX: opencodeforge-v

# ── Variables and secrets ────────────────────────────────────────────────────
# This workflow delegates all build work to `src/publish/publish.ps1 -App OpenCodeForge` — the
# same script and the same app descriptor a developer uses locally. See
# src/publish/PublishApps.ps1 for what "the app" means to those scripts.
#
# Signing secrets are documented on release.yml and apply identically here; this app's
# binaries are likewise published UNSIGNED and signed out-of-band on a developer machine.

jobs:

  # ── Gate: tests must pass on all platforms before anything is published ─────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - run: dotnet restore ClaudeForge.slnx

      # -c Debug, not Release, and for a reason that now applies to BOTH apps: in Release
      # configuration each app csproj sets <RuntimeIdentifiers> (plural), which makes MSBuild
      # auto-pick the host RID at build time and require RID-qualified assets in
      # obj/project.assets.json. The preceding restore is RID-agnostic, so a Release build here
      # fails with NETSDK1047. Release-mode build and trim coverage comes from the publish jobs
      # below and from ci.yml's Trim Check.
      - run: dotnet build ClaudeForge.slnx --no-restore -c Debug

      - run: dotnet test ClaudeForge.slnx --no-build -c Debug

  # ── Publish via src/publish/publish.ps1 on each host OS ────────────────────
  #
  # One job per OS so each RID builds on its native host:
  #
  #   windows-latest  → win-x64, win-arm64   (Windows TFM + maui-windows workload)
  #   ubuntu-latest   → linux-x64, linux-arm64
  #   macos-latest    → osx-x64, osx-arm64   (native dylibs match the runner arch)
  #
  # Artifact naming comes from the app descriptor's AssemblyName, so these are
  # OpenCodeForge-<rid>.zip / .tar.gz — unversioned, because the version lives in the tag.
  #
  # ⓘ PublicVersion is exported because MSBuild surfaces environment variables as properties
  # and the AutoVersioning generator may read it. It does NOT affect archive filenames; the
  # scripts name archives from the assembly name alone.
  publish-windows:
    name: Publish (Windows)
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Extract version from tag
        shell: bash
        run: echo "PublicVersion=${GITHUB_REF_NAME#${TAG_PREFIX}}" >> "$GITHUB_ENV"

      - name: Publish (win-x64, win-arm64)
        shell: pwsh
        # Called directly rather than through an inner `pwsh` invocation: `shell: pwsh` already
        # runs this block in pwsh, and nesting makes the outer shell pass
        # "win-x64,win-arm64" as ONE argv string, which fails publish.ps1's [ValidateSet].
        run: ./src/publish/publish.ps1 -App OpenCodeForge -All -Rids win-x64,win-arm64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: src/dist/*.zip
          retention-days: 1
          if-no-files-found: error

  publish-linux:
    name: Publish (Linux)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Extract version from tag
        run: echo "PublicVersion=${GITHUB_REF_NAME#${TAG_PREFIX}}" >> "$GITHUB_ENV"

      - name: Publish (linux-x64, linux-arm64)
        shell: pwsh
        run: ./src/publish/publish.ps1 -App OpenCodeForge -All -Rids linux-x64,linux-arm64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: src/dist/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish-macos:
    name: Publish (macOS)
    needs: test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Extract version from tag
        run: echo "PublicVersion=${GITHUB_REF_NAME#${TAG_PREFIX}}" >> "$GITHUB_ENV"

      - name: Publish (osx-x64, osx-arm64)
        shell: pwsh
        run: ./src/publish/publish.ps1 -App OpenCodeForge -All -Rids osx-x64,osx-arm64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: src/dist/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  # ── Create the GitHub Release ───────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [publish-windows, publish-linux, publish-macos]
    runs-on: ubuntu-latest

    steps:
      # Full history: the changelog path reads the tagged commit's message body, and
      # --generate-notes diffs between tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#${TAG_PREFIX}}" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      # ⛔ Tested against $VERSION, NOT $GITHUB_REF_NAME. Every tag this workflow fires on
      # contains a hyphen in its own PREFIX, so the sibling workflow's
      # `[[ "$GITHUB_REF_NAME" == *-* ]]` would mark every single OpenCodeForge release as a
      # pre-release. The version is the only part where a hyphen means what it means in semver.
      - name: Detect pre-release
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE_FLAG=--prerelease" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE_FLAG=" >> "$GITHUB_ENV"
          fi

      # Changelog source, in priority order:
      #   1. PR merge   — the tag's commit is a PR merge commit; the PR body is the changelog.
      #   2. Direct push — the commit message body becomes the changelog.
      #   3. Fallback   — GitHub's --generate-notes, bucketed by PR label per .github/release.yml.
      - name: Resolve changelog source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)

          PR_NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
            --jq '.[0].number // empty' 2>/dev/null || echo "")

          if [[ -n "$PR_NUMBER" ]]; then
            echo "Changelog source: PR #${PR_NUMBER} body"
            gh pr view "$PR_NUMBER" --json body --jq '.body' > changelog-content.md
            echo "CHANGELOG_SOURCE=pr" >> "$GITHUB_ENV"
          else
            COMMIT_BODY=$(git log -1 --format='%b' HEAD)
            if [[ -n "$COMMIT_BODY" ]]; then
              echo "Changelog source: commit message body"
              printf '%s' "$COMMIT_BODY" > changelog-content.md
              echo "CHANGELOG_SOURCE=commit" >> "$GITHUB_ENV"
            else
              echo "Changelog source: --generate-notes fallback"
              echo "CHANGELOG_SOURCE=generate" >> "$GITHUB_ENV"
            fi
          fi

      # Filename pattern is fixed by the app descriptor's AssemblyName:
      #   Windows  → OpenCodeForge-<rid>.zip
      #   Linux    → OpenCodeForge-<rid>.tar.gz   (bundles linux-setup.sh + .desktop + .svg)
      #   macOS    → OpenCodeForge-<rid>.tar.gz   (bundles allow-app-to-run.sh)
      - name: Write release notes
        run: |
          cat > release-notes.md << EOF
          ## Downloads

          | Platform              | Architecture   | File                                            |
          |-----------------------|----------------|-------------------------------------------------|
          | Windows               | x64            | \`${{ env.APP_NAME }}-win-x64.zip\`             |
          | Windows               | ARM64          | \`${{ env.APP_NAME }}-win-arm64.zip\`           |
          | Linux                 | x64            | \`${{ env.APP_NAME }}-linux-x64.tar.gz\`        |
          | Linux                 | ARM64          | \`${{ env.APP_NAME }}-linux-arm64.tar.gz\`      |
          | macOS (Intel)         | x64            | \`${{ env.APP_NAME }}-osx-x64.tar.gz\`          |
          | macOS (Apple Silicon) | ARM64          | \`${{ env.APP_NAME }}-osx-arm64.tar.gz\`        |

          The version (${{ env.VERSION }}) is encoded in the release tag rather than in
          the archive filenames — the publish scripts produce unversioned artefact names
          so local dev builds and CI builds share one filename pattern.

          **Linux:** Extract, then run the bundled \`linux-setup.sh\` to install a per-user \`.desktop\` entry so Wayland compositors render the window icon correctly:
          \`\`\`bash
          mkdir -p ~/${{ env.APP_NAME }}
          tar -xzf ${{ env.APP_NAME }}-linux-x64.tar.gz -C ~/${{ env.APP_NAME }}
          cd ~/${{ env.APP_NAME }}
          ./linux-setup.sh
          ./${{ env.APP_NAME }}
          \`\`\`

          **macOS:** The binary is unsigned. Use the bundled \`allow-app-to-run.sh\` to strip the Gatekeeper quarantine xattr from every file in the extracted directory:
          \`\`\`bash
          mkdir -p ~/${{ env.APP_NAME }}
          tar -xzf ${{ env.APP_NAME }}-osx-arm64.tar.gz -C ~/${{ env.APP_NAME }}
          cd ~/${{ env.APP_NAME }}
          ./allow-app-to-run.sh
          ./${{ env.APP_NAME }}
          \`\`\`

          ---
          EOF

          if [[ "$CHANGELOG_SOURCE" != "generate" ]]; then
            {
              echo ""
              echo "## What's Changed"
              echo ""
              cat changelog-content.md
            } >> release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA_FLAGS=""
          [[ "$CHANGELOG_SOURCE" == "generate" ]] && EXTRA_FLAGS="--generate-notes"

          gh release create "$GITHUB_REF_NAME" \
            --title "${{ env.APP_NAME }} ${{ env.VERSION }}" \
            --notes-file release-notes.md \
            $EXTRA_FLAGS \
            ${{ env.PRERELEASE_FLAG }} \
            artifacts/${{ env.APP_NAME }}-win-x64.zip \
            artifacts/${{ env.APP_NAME }}-win-arm64.zip \
            artifacts/${{ env.APP_NAME }}-linux-x64.tar.gz \
            artifacts/${{ env.APP_NAME }}-linux-arm64.tar.gz \
            artifacts/${{ env.APP_NAME }}-osx-x64.tar.gz \
            artifacts/${{ env.APP_NAME }}-osx-arm64.tar.gz

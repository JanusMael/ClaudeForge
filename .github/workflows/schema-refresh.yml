name: Schema refresh

# Detect upstream drift of EVERY bundled JSON schema that has an upstream. Runs the
# hand-maintained `scripts/refresh-schema.ps1`, which walks its own schema table, and
# opens a pull request for human review if the working tree changes. Never commits to
# the default branch directly.
#
# Design rationale — see also `.github/WORKFLOWS.md`:
#   - Pure drift detection. The script is idempotent (it compares
#     line-ending-normalised content, so re-running writes nothing) and the
#     no-drift path emits no PR.
#   - The sibling `*.overlay.json` files are never touched by the script, so
#     this workflow can never silently overwrite hand-curated additions
#     (model id list, model.examples, etc.).
#   - ⚠ The drift check scopes to the whole schema DIRECTORY, not one filename.
#     It was per-file when only one schema had an upstream; leaving it that way
#     would refresh the others on disk and then discard them with no PR.
#   - Human review of the schema diff is the whole point — auto-merge is
#     deliberately not configured. Reviewer reads the diff, runs the
#     overlay guard tests locally if anything looks load-bearing, then
#     approves.

on:
  schedule:
    # Mondays 09:00 UTC — same slot as Dependabot. The two open PRs in
    # the same window so weekly maintenance is one review pass.
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Don't cancel an in-flight scheduled run if a manual dispatch arrives.
# Drift detection is cheap and idempotent; finishing both runs is fine.
concurrency:
  group: schema-refresh
  cancel-in-progress: false

permissions:
  contents: write       # create branch + commit
  pull-requests: write  # open the PR

jobs:
  refresh:
    name: Refresh + PR on drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pwsh is preinstalled on the ubuntu-latest runner image; no setup
      # step needed. The script uses only Invoke-WebRequest + Get-Content
      # + ConvertFrom-Json + Get-FileHash — all built-in to PowerShell 7.

      - name: Run refresh-schema.ps1
        shell: pwsh
        run: |
          # The script is idempotent: hash short-circuit when upstream
          # matches the bundled copy. The hash check writes "Already up
          # to date" and exits 0, leaving the working tree unchanged.
          # The drift path overwrites src/AgentForge.Core/Assets/Schemas/
          # claude-code-settings.json and exits 0.
          pwsh scripts/refresh-schema.ps1

      - name: Detect drift
        id: drift
        shell: bash
        run: |
          # The whole schema directory, because the script refreshes every schema that has
          # an upstream — three today. Scoping this to one filename is how a second schema
          # gets refreshed on disk and then silently discarded with no PR.
          #
          # Anything OUTSIDE this directory changing would be a workflow bug, so the scope
          # stays the directory rather than the whole tree.
          SCOPE=src/AgentForge.Core/Assets/Schemas
          if git diff --quiet -- "$SCOPE"; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected - every bundled schema matches upstream."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Drift detected."
            echo "::group::Diff summary"
            git diff --stat -- "$SCOPE"
            echo "::endgroup::"

            # Name the changed files so the PR body says WHICH schemas moved. A reviewer
            # opening a PR titled "refresh bundled schemas" should not have to read the
            # diff to find out which ones.
            {
              echo 'files<<SCHEMA_FILES_EOF'
              git diff --name-only -- "$SCOPE" | sed 's|^|- `|; s|$|`|'
              echo 'SCHEMA_FILES_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      # Open the PR only when drift was detected. peter-evans/create-pull-request
      # handles the branch-already-exists case automatically: if a prior run
      # left an open chore/schema-refresh PR, this updates it in place rather
      # than opening a duplicate.
      - name: Open / update drift PR
        if: steps.drift.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: |
            chore(schema): refresh bundled schemas from upstream

            Auto-generated by .github/workflows/schema-refresh.yml.
            Reviewer: inspect the schema diff. The hand-curated `*.overlay.json`
            siblings are NOT touched by the refresh; they are merged onto
            whichever base wins at runtime via RFC 7396 JSON Merge Patch.
          branch: chore/schema-refresh
          delete-branch: true
          title: 'chore(schema): refresh bundled schemas from upstream'
          body: |
            ## What this PR does

            Refreshes the bundled schemas under `src/AgentForge.Core/Assets/Schemas/` that have
            an upstream — one or more of them has changed since the last refresh.

            ### Schemas changed in this PR

            ${{ steps.drift.outputs.files }}

            The script covers `claude-code-settings.json` (schemastore.org),
            `opencode-config.json` and `opencode-tui.json` (opencode.ai).
            `claude-desktop-config.json` has no upstream URL — its `$id` is a bare token — so it
            is hand-maintained and never appears here.

            ## Reviewer checklist

            - [ ] Read the schema diff. Anything load-bearing (new shapes, removed properties,
                  type changes) should be cross-checked against the editor factory dispatch in
                  `src/ClaudeForge/ViewModels/Editors/PropertyEditorFactory.cs` /
                  `DefaultEditorFactory.cs`.
            - [ ] Confirm the overlay guards still pass (`SchemaRegistryOverlayTests`,
                  `ModelPropertyPromotionTests`). No `*.overlay.json` was touched — if a
                  hand-curated key is now present upstream, delete it from the overlay so
                  upstream's value wins.
            - [ ] ⛔ If `opencode-config.json` changed, confirm `BundledOpenCodeSchemaTests`
                  passes. Upstream types four `model` properties with an external
                  `models.dev` `$ref`; the script strips those, and a schema that kept one
                  throws on save for any config that sets a model.
            - [ ] Check `SchemaRefreshDriftTests`. A changed top-level property count or a nav
                  grouping key that no longer exists both fail there deliberately — update the
                  reviewed counts in that file rather than silencing it.
            - [ ] Spot-check the bundled schema produces a typed editor for any new property
                  (avoid the `JsonRaw` fallback for properties whose shape is well-known).

            ## How this is triggered

            Weekly schedule (Mondays 09:00 UTC) plus manual `workflow_dispatch`. The
            refresh script is idempotent — no drift means no PR.

            ## What this PR does NOT do

            It does not touch any `*.overlay.json`, the editor factory, tests, or any other
            source. Schema-only.
          labels: |
            schema-refresh
            dependencies
          # The `dependencies` label is excluded from the release changelog
          # via .github/release.yml so refresh PRs don't pollute release notes.

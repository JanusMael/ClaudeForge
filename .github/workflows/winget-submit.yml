name: Submit to winget

# Manually-dispatched winget submission for ONE of this repository's apps.
#
# Pick the app with the `app` input. Everything app-shaped — the winget package
# id, the release-tag prefix, the assembly the assets and signed .exe are named
# after — comes from src/publish/PublishApps.ps1, the same table the publish
# scripts read. ⛔ Do not hardcode any of it here: the two apps' release tags have
# different SHAPES (ClaudeForge publishes a bare v<version>, later apps a
# prefixed one), so a hardcoded tag builds a download URL that 404s at winget
# validation for every app but the first.
#
# Run this AFTER the release's Windows zips have been SIGNED and re-uploaded.
# winget records a SHA256 computed from the live release asset, so submitting
# BEFORE the signed re-upload would pin the unsigned hash — hence manual, and
# always after signing.
#
# WHAT THIS DOES
# --------------
# Builds the COMPLETE manifest from the templates in packaging/winget/*.yaml —
# the single source of truth, carrying the full catalog metadata (Author,
# Description, Moniker, Tags, Copyright, LicenseUrl, …). It fills in the version
# and freshly computed SHA256 hashes, injects the GitHub release's notes + date,
# and opens the winget-pkgs PR via `wingetcreate submit`.
#
# This deliberately does NOT use `wingetcreate update`. `update` fetches the
# CURRENTLY PUBLISHED manifest and only bumps the version + URLs, which means it
# inherits whatever metadata is already published and silently drops the rich
# fields — that is exactly how earlier submissions ended up sparse ("Author: Not
# available", empty release notes). Submitting the template keeps every release
# fully populated.
#
# Requires repository secret WINGET_TOKEN: a GitHub PAT (classic) with BOTH the
# `public_repo` AND `workflow` scopes. `wingetcreate` forks winget-pkgs and syncs
# the fork with upstream; because upstream carries .github/workflows/* files, the
# fork sync is refused without the `workflow` scope. See packaging/winget/README.md.

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to submit."
        required: true
        type: choice
        default: ClaudeForge
        options:
          - ClaudeForge
          - OpenCodeForge
      version:
        description: "Release version to submit (no leading 'v'), e.g. 2026.3.701."
        required: true
        type: string

permissions:
  contents: read

jobs:
  winget:
    name: Submit winget manifest
    runs-on: windows-latest
    env:
      # Passed via env (not inline ${{ }}) so untrusted input can't be injected
      # into the script body.
      VERSION_INPUT: ${{ github.event.inputs.version }}
      APP_INPUT: ${{ github.event.inputs.app }}
      REPO: ${{ github.repository }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout (manifest templates)
        uses: actions/checkout@v7

      - name: Build manifests from templates and submit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:WINGET_TOKEN) {
            Write-Error "WINGET_TOKEN secret is not set. Create a GitHub PAT (classic) with the 'public_repo' AND 'workflow' scopes and add it as the repo secret WINGET_TOKEN. See packaging/winget/README.md."
            exit 1
          }

          # Decode `gh` output as UTF-8. Without this the console's OEM code page
          # mangles non-ASCII in the release body before it reaches the manifest
          # (an em dash lands as "ΓÇö"). Kept in sync with packaging/Submit-Winget.ps1.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $ver = $env:VERSION_INPUT -replace '^v', ''
          if (-not $ver) { Write-Error "A version input is required."; exit 1 }

          # Everything app-shaped comes from the publish table, so this workflow and
          # packaging/Submit-Winget.ps1 cannot disagree about what an app IS.
          # $appInfo, never $app — PowerShell variable names are case-insensitive.
          . ./src/publish/PublishApps.ps1
          $appName   = if ($env:APP_INPUT) { $env:APP_INPUT } else { 'ClaudeForge' }
          $appInfo   = Get-PublishApp -Name $appName
          $packageId = $appInfo.WingetPackageId
          $assetStem = $appInfo.AssemblyName
          $tagPrefix = $appInfo.TagPrefix
          Write-Host "App: $appName  package: $packageId  assets: $assetStem-win-*.zip"

          # Duplicate guard. Three paths can submit: this workflow (manually), this
          # workflow dispatched automatically by packaging/sign-release.ps1 (unless
          # -SkipWinget), and packaging/Submit-Winget.ps1 locally. Two of them firing
          # for one release opens two PRs against the same manifest, which winget-pkgs
          # asks contributors not to do — 2026.3.810 shipped exactly that.
          $existing = gh api "search/issues?q=repo:microsoft/winget-pkgs+author:JanusMael+type:pr+state:open+in:title+$packageId" `
            --jq ".items[] | select(.title | contains(`"$ver`")) | `"#\(.number) \(.title)`"" 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Error ("An open winget-pkgs PR already exists for $packageId ${ver}:`n  $existing`n" +
                         "Close it first, or let that submission finish. Note sign-release.ps1 dispatches this workflow automatically unless -SkipWinget is passed.")
            exit 1
          }

          # ⚠ Prefixed for every app but the first — see this workflow's header.
          $tag      = "$tagPrefix" + "v$ver"
          $base     = "https://github.com/$($env:REPO)/releases/download/$tag"
          $x64Url   = "$base/$assetStem-win-x64.zip"
          $arm64Url = "$base/$assetStem-win-arm64.zip"
          Write-Host "Submitting $packageId $ver"

          # 1. Download the (signed) release assets and compute their SHA256.
          #    winget-pkgs validation recomputes these from the same URLs, so the
          #    hashes must match the live assets exactly.
          New-Item -ItemType Directory -Force -Path dl | Out-Null
          Invoke-WebRequest -Uri $x64Url   -OutFile dl/x64.zip
          Invoke-WebRequest -Uri $arm64Url -OutFile dl/arm64.zip
          # 1a. SIGNING GATE — refuse to submit unsigned binaries.
          #
          #     CI cannot sign: the SimplySign cloud certificate is only available to
          #     packaging/sign-release.ps1 on a developer machine. The release workflow
          #     publishes UNSIGNED zips; sign-release.ps1 then signs them, re-uploads in
          #     place, and dispatches this workflow. So this workflow is only correct
          #     AFTER that re-upload — dispatched too early it would pin the SHA256 of an
          #     unsigned asset and publish it to the winget catalog permanently.
          #
          #     Rather than trusting the caller, verify the precondition itself: crack
          #     each zip and require a VALID Authenticode signature on the app's .exe.
          #     This holds however the workflow was triggered.
          foreach ($arch in 'x64', 'arm64') {
            $ex = "dl/extract-$arch"
            Expand-Archive -Path "dl/$arch.zip" -DestinationPath $ex -Force
            $exeName = "$assetStem.exe"
            $exe = Get-ChildItem $ex -Filter $exeName -Recurse | Select-Object -First 1
            if (-not $exe) {
              Write-Error "$arch zip does not contain $exeName — cannot verify signing."
              exit 1
            }
            $sig = Get-AuthenticodeSignature $exe.FullName
            Write-Host "$arch Authenticode: $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Error ("$arch $exeName is not validly signed (status: $($sig.Status)). " +
                           'The release assets have not been signed and re-uploaded yet. Run ' +
                           'packaging/sign-release.ps1 (it signs, re-uploads, then dispatches this ' +
                           'workflow) instead of dispatching this workflow directly.')
              exit 1
            }
          }
          Remove-Item dl/extract-x64, dl/extract-arm64 -Recurse -Force

          # Hash the ZIP as published — computed after the signing gate so a failed
          # gate can never leave a usable hash behind.
          $sha64  = (Get-FileHash dl/x64.zip   -Algorithm SHA256).Hash
          $shaArm = (Get-FileHash dl/arm64.zip -Algorithm SHA256).Hash
          Write-Host "x64   SHA256 $sha64"
          Write-Host "arm64 SHA256 $shaArm"

          # 2. Stage the templates with version + hashes substituted in.
          $stage = Join-Path $env:RUNNER_TEMP 'wingetmanifests'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # ⛔ THIS APP'S MANIFESTS ONLY. packaging/winget/ holds a set per app, and
          # this used to glob '*.yaml' — correct with one app, silently wrong with
          # two: wingetcreate would carry BOTH packages' manifests into one
          # winget-pkgs PR, publishing a version bump for an app that had not
          # released. Matched by exact name rather than "$packageId*" so an id that
          # merely starts with another cannot absorb its sibling's files.
          # Kept in sync with packaging/Submit-Winget.ps1.
          $ownManifests = @(Get-ChildItem packaging/winget/*.yaml | Where-Object {
            $_.Name -eq "$packageId.yaml" -or
            $_.Name -eq "$packageId.installer.yaml" -or
            $_.Name -like "$packageId.locale.*.yaml"
          })
          if ($ownManifests.Count -eq 0) {
            Write-Error "No manifest templates for $packageId in packaging/winget/."
            exit 1
          }
          Write-Host "Staging $($ownManifests.Count) manifest(s) for $packageId"
          $ownManifests | ForEach-Object {
            $text = (Get-Content $_.FullName -Raw).
              Replace('<PACKAGE_VERSION>', $ver).
              Replace('<SHA256_X64>',   $sha64).
              Replace('<SHA256_ARM64>', $shaArm)
            Set-Content -Path (Join-Path $stage $_.Name) -Value $text -Encoding utf8
          }
          $localeFile    = Join-Path $stage "$packageId.locale.en-US.yaml"
          $installerFile = Join-Path $stage "$packageId.installer.yaml"

          # 3. Best-effort enrichment from the GitHub release: ReleaseDate (installer
          #    manifest) and ReleaseNotes (locale manifest). Any failure here degrades
          #    gracefully — the manifest still submits, just without these extras
          #    (ReleaseNotesUrl is always present from the template).
          try {
            $raw = gh release view $tag --repo $env:REPO --json publishedAt,body 2>$null
            if ($LASTEXITCODE -eq 0 -and $raw) {
              $rel = $raw | ConvertFrom-Json

              if ($rel.publishedAt) {
                $date = ([datetimeoffset]$rel.publishedAt).ToString('yyyy-MM-dd')
                Add-Content -Path $installerFile -Value "ReleaseDate: $date" -Encoding utf8
                Write-Host "ReleaseDate: $date"
              }

              $body = $rel.body
              if ($body) {
                # Normalize newlines, drop leading/trailing blank lines, cap length
                # (winget limits ReleaseNotes to 10000 chars), then emit a YAML
                # literal block with every line indented 2 spaces.
                $body = ($body -replace "`r", '').Trim()
                if ($body.Length -gt 9000) { $body = $body.Substring(0, 9000).Trim() }
                $indented = ($body -split "`n" | ForEach-Object { '  ' + $_ }) -join "`n"
                Add-Content -Path $localeFile -Value "ReleaseNotes: |-`n$indented" -Encoding utf8
                Write-Host "Injected ReleaseNotes ($($body.Length) chars)."
              }
            }
            else {
              Write-Host "::warning::Could not read release $tag metadata; submitting without ReleaseNotes/ReleaseDate."
            }
          }
          catch {
            Write-Host "::warning::Release enrichment failed ($($_.Exception.Message)); submitting without ReleaseNotes/ReleaseDate."
          }

          Write-Host "----- staged locale manifest -----"
          Get-Content $localeFile

          # 4. Download wingetcreate and submit the completed manifest folder.
          #    `submit` forks winget-pkgs, syncs the fork with upstream, commits the
          #    manifests, and opens the PR (non-interactive: --token + --no-open).
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit $stage `
            --prtitle "New version: $packageId version $ver" `
            --token $env:WINGET_TOKEN `
            --no-open

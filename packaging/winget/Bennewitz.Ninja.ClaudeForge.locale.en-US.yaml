# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json
#
# Default-locale manifest (template). Publisher is the author's name; the
# PackageIdentifier prefix (Bennewitz.Ninja) is the author's namespace — the two
# do not have to match.
PackageIdentifier: Bennewitz.Ninja.ClaudeForge
PackageVersion: "<PACKAGE_VERSION>"
PackageLocale: en-US
Publisher: Brian Bennewitz
PublisherUrl: https://github.com/JanusMael
PublisherSupportUrl: https://github.com/JanusMael/ClaudeForge/issues
Author: Brian Bennewitz
PackageName: ClaudeForge
PackageUrl: https://github.com/JanusMael/ClaudeForge
License: MIT
LicenseUrl: https://github.com/JanusMael/ClaudeForge/blob/main/LICENSE
Copyright: Copyright (c) 2024-2026 ClaudeForge Contributors
CopyrightUrl: https://github.com/JanusMael/ClaudeForge/blob/main/LICENSE
ShortDescription: A cross-platform desktop editor for Claude Code and Claude Desktop configuration files.
Description: >-
  ClaudeForge is a cross-platform desktop editor for Claude Code and Claude
  Desktop configuration. It provides schema-validated, guided editors for
  settings.json, permission allow/deny/ask rules, hooks, MCP servers,
  environment variables, the model catalog, user-memory files, and
  agents/skills/slash-commands — plus backup and restore.
Moniker: claudeforge
Tags:
  - claude
  - claude-code
  - anthropic
  - ai
  - configuration
  - settings
  - editor
  - developer-tools
  - avalonia
  - dotnet
ReleaseNotesUrl: https://github.com/JanusMael/ClaudeForge/releases/tag/v<PACKAGE_VERSION>
# Carried over from the 2026.3.708 / 2026.3.724 published manifests. `wingetcreate
# submit` builds the manifest ONLY from this template — unlike `update`, it does not
# inherit fields from the published version — so anything omitted here is silently
# dropped from the catalog entry. That is exactly how this was lost in 2026.3.810.
Documentations:
  - DocumentLabel: Wiki
    DocumentUrl: https://github.com/JanusMael/ClaudeForge/wiki
# `ReleaseNotes` (the release body) is injected at submission time by
# .github/workflows/winget-submit.yml from the GitHub release — kept out of this
# static template because it is per-version. `ReleaseDate` is likewise injected
# into the installer manifest.
#
# Icons: winget's own clients render an icon from the manifest, but UniGetUI (the
# GUI in the screenshots) uses its OWN icon/screenshot database, not this field —
# contribute those at https://www.marticliment.com/wingetui/help/icons-and-screenshots/.
# If you later host a stable PNG, advertise it to winget-native clients by filling
# in and uncommenting the block below (IconSha256 is REQUIRED):
# Icons:
#   - IconUrl: https://github.com/JanusMael/ClaudeForge/releases/download/v<PACKAGE_VERSION>/ClaudeForge.png
#     IconFileType: png
#     IconResolution: custom
#     IconTheme: default
#     IconSha256: <SHA256_OF_ICON_PNG>
ManifestType: defaultLocale
ManifestVersion: 1.12.0
